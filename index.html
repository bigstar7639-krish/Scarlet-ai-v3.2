<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scarlet AI V4 - All Fixed</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:Inter,sans-serif}</style>
</head>
<body class="h-[100dvh] flex flex-col bg-[#f6f7f8]">
<div class="h-[56px] bg-white border-b flex items-center justify-between px-4">
<div class="flex gap-2 items-center">
<div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 text-white flex items-center justify-center font-bold">S</div>
<b>Scarlet AI V4</b><span class="text-[8px] px-2 py-0.5 rounded-full bg-green-600 text-white">GITHUB VERCEL FIXED</span>
</div>
<button onclick="location.reload()" class="text-[11px] px-3 py-1.5 rounded-full bg-black text-white">New</button>
</div>

<div class="bg-white border-b p-2">
<div class="max-w-[720px] mx-auto flex gap-2">
<input id="keyIn" placeholder="gsk_... Groq key from console.groq.com/keys" class="flex-1 rounded-full border px-4 py-2 text-[12px]">
<button onclick="saveKey()" class="px-4 py-2 rounded-full bg-black text-white text-[11px]">Save</button>
</div>
<p id="kStat" class="max-w-[720px] mx-auto text-[10px] mt-1 text-green-600"></p>
</div>

<div id="area" class="flex-1 overflow-auto p-4">
<div class="max-w-[720px] mx-auto">
<div id="hero" class="text-center pt-10">
<div class="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-blue-500 to-purple-600 text-white flex items-center justify-center text-[24px] font-bold">S</div>
<h1 class="text-[18px] font-bold mt-3">V4 - All Bugs Fixed</h1>
<p class="text-[10px] text-black/50">1. Groq fallback 2. No Pollination 3. Charset fixed</p>
<div class="grid grid-cols-2 gap-2 mt-4">
<button onclick="say('Hi')" class="p-3 rounded-xl bg-white border text-[11px]">Hi</button>
<button onclick="say('Generate red moon image')" class="p-3 rounded-xl bg-white border text-[11px]">Red Moon</button>
<button onclick="say('Generate cat image')" class="p-3 rounded-xl bg-white border text-[11px]">Cat Art</button>
<button onclick="say('Why red moon?')" class="p-3 rounded-xl bg-white border text-[11px]">Why Red Moon</button>
</div>
</div>
<div id="msgs" class="hidden space-y-3"></div>
</div>
</div>

<div class="bg-white border-t p-3">
<div class="max-w-[720px] mx-auto flex gap-2">
<input id="inp" placeholder="Ask or Generate image..." class="flex-1 rounded-full bg-[#f0f0f0] px-5 py-3 outline-none text-[13px]">
<button onclick="send()" class="w-11 h-11 rounded-full bg-black text-white">↑</button>
</div>
</div>

<script>
let KEY = localStorage.getItem('groq_key') || '';
if(KEY){ document.getElementById('keyIn').value = KEY; document.getElementById('kStat').innerText = 'Active: ' + KEY.slice(0,12) + '... Model: openai/gpt-oss-20b (auto fallback)'; }
function saveKey(){ let k=document.getElementById('keyIn').value.trim(); if(!k.startsWith('gsk_')){alert('Key must start gsk_'); return;} localStorage.setItem('groq_key',k); KEY=k; document.getElementById('kStat').innerText='Saved! Reloading...'; location.reload(); }
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function add(role,html,isHtml){ const m=document.getElementById('msgs'); m.classList.remove('hidden'); document.getElementById('hero').classList.add('hidden'); const d=document.createElement('div'); d.className='flex gap-2 items-start'; const av=role==='user'?'<div class="w-6 h-6 rounded-full bg-black text-white flex items-center justify-center text-[9px]">You</div>':'<div class="w-6 h-6 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 text-white flex items-center justify-center text-[9px]">S</div>'; const box='<div class="flex-1 bg-'+(role==='user'?'[#e8e8ea]':'white')+' '+(role==='user'?'':'border')+' px-3 py-2.5 rounded-[16px] text-[13px] whitespace-pre-wrap">'+(isHtml?html:esc(html))+'</div>'; d.innerHTML=av+box; m.appendChild(d); document.getElementById('area').scrollTop=99999; return d; }

function makeCanvas(prompt){
 const low=prompt.toLowerCase(); const c=document.createElement('canvas'); c.width=512; c.height=512; const ctx=c.getContext('2d');
 if(low.includes('moon')||low.includes('red')){
  const g=ctx.createRadialGradient(200,200,0,256,256,240); g.addColorStop(0,'#ffe4e6'); g.addColorStop(0.2,'#ef4444'); g.addColorStop(0.5,'#7f1d1d'); g.addColorStop(1,'#000'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(256,256,200,0,Math.PI*2); ctx.fill();
 } else if(low.includes('cat')){
  ctx.fillStyle='#111'; ctx.fillRect(0,0,512,512); ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(150,200,40,0,Math.PI*2); ctx.arc(362,200,40,0,Math.PI*2); ctx.fill();
 } else if(low.includes('sunset')){
  const g=ctx.createLinearGradient(0,0,0,512); g.addColorStop(0,'#ff7e5f'); g.addColorStop(1,'#1a1a2e'); ctx.fillStyle=g; ctx.fillRect(0,0,512,512); ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(256,300,80,0,Math.PI*2); ctx.fill();
 } else {
  ctx.fillStyle='#0a0a0a'; ctx.fillRect(0,0,512,512); for(let i=0;i<15;i++){ ctx.fillStyle=['#ef4444','#3b82f6','#10b981'][i%3]; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(Math.random()*512,Math.random()*512,Math.random()*60,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
 }
 ctx.fillStyle='white'; ctx.font='bold 12px Inter'; ctx.fillText(prompt.slice(0,35),10,500); return c;
}

async function callGroq(txt){
 const MODELS=["openai/gpt-oss-20b","openai/gpt-oss-120b","llama-3.3-70b-versatile","llama-3.1-8b-instant"];
 for(let model of MODELS){
  try{
   const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({model,messages:[{role:'user',content:txt}]})});
   const data=await res.json(); if(data.error){console.log(model+' failed'); continue;} return data.choices[0].message.content;
  }catch(e){continue;}
 }
 return 'All models failed. Create new key at console.groq.com/keys';
}

function isImg(t){ let l=t.toLowerCase(); return l.includes('image')||l.includes('generate')||l.includes('draw')||l.includes('moon')||l.includes('cat')||l.includes('sunset'); }

async function send(text){
 const inp=document.getElementById('inp'); const txt=(text||inp.value).trim(); if(!txt) return; inp.value=''; add('user',txt);
 if(isImg(txt)){
  const load=add('ai','Canvas generating (No Pollination)...');
  await new Promise(r=>setTimeout(r,300));
  const c=makeCanvas(txt); load.remove();
  const div=add('ai','',true); const cont=div.querySelector('div:last-child'); cont.innerHTML='<b>Canvas Generated: '+esc(txt)+'</b><br><span class="text-[10px] text-black/50">No Pollination - Pure Canvas</span><br>'; cont.appendChild(c);
  const a=document.createElement('a'); a.href=c.toDataURL(); a.download='scarlet.png'; a.textContent='Download'; a.className='text-[11px] bg-black text-white px-3 py-1 rounded-full mt-2 inline-block'; cont.appendChild(a); return;
 }
 if(!KEY){ add('ai','Add Groq key on top first! console.groq.com/keys'); return; }
 const load=add('ai','Typing...'); const reply=await callGroq(txt); load.remove(); add('ai',reply);
}
function say(t){ send(t); }
document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter') send();});
</script>
</body>
</html>
